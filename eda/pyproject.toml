[project]
name = "agentlogs-eda"
version = "0.1.0"
description = "Notebook-based exploratory analysis of the AgentLogs dataset"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "huggingface-hub>=2.2.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pip>=26.2.2",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "risenlab-agentlogs~=1.0.0",
    "ruff>=0.17.1",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[tool.uv.sources]
risenlab-agentlogs = { path = '..\packages\risenlab-agentlogs', editable = true }
