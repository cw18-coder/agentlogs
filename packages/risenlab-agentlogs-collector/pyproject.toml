[project]
name = "risenlab-agentlogs-collector"
version = "1.0.1"
description = "Collector for the AgentLogs dataset"
requires-python = ">=3.12"

dependencies = [
    "risenlab-agentlogs",
    "requests>=2.32.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",
    "httpx[http2]>=0.27.0",
    "httpx-sse>=0.4.0",
    "zstandard>=0.22.0",
    "pyarrow>=16.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlogs"]